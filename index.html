<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>语录收集 · 把截图变成 Markdown</title>
  <link rel="stylesheet" href="./renderer/styles.css">
  <link rel="stylesheet" href="./renderer/groups.css">
  <script src="./vendor/lucide.min.js"></script>
  <script src="./vendor/marked.min.js"></script>
</head>
<body>
  <header class="titlebar">
    <div class="brand no-drag">
      <span class="brand-mark" aria-hidden="true"><img src="build/icons/icons/png/256x256.png" alt=""></span>
      <span class="brand-copy"><strong>语录收集</strong><small>Screenshot to Markdown</small></span>
      <span id="app-version" class="version"></span>
    </div>
    <div class="title-drag"></div>
    <div class="title-actions no-drag">
      <button id="api-status" class="api-status" title="打开连接设置"><i data-lucide="circle-alert"></i><span>API 未配置</span></button>
      <button id="settings-btn" class="icon-btn settings-trigger" title="设置"><i data-lucide="settings"></i><b>设置</b></button>
      <button id="win-minimize" class="win-btn" title="最小化"><i data-lucide="minus"></i></button>
      <button id="win-maximize" class="win-btn" title="最大化"><i data-lucide="square"></i></button>
      <button id="win-close" class="win-btn close" title="关闭"><i data-lucide="x"></i></button>
    </div>
  </header>

  <div id="progress-track" class="progress-track"><div id="progress-bar"></div></div>

  <main class="app-root">
    <section id="library-view" class="library-view">
      <header class="library-hero">
        <div class="hero-copy">
          <span class="eyebrow">SCREENSHOT · OCR · MARKDOWN</span>
          <h1>把截图里的好内容<br><span>收进</span>你的知识库</h1>
          <p>整理截图、校对原文，再生成干净可编辑的 Markdown。每个任务都会在本机自动保存。</p>
          <div class="hero-actions">
            <button id="library-import" class="btn primary large"><i data-lucide="image-plus"></i>导入截图开始</button>
            <button id="library-new-task" class="btn secondary large"><i data-lucide="file-plus-2"></i>新建空任务</button>
          </div>
        </div>
        <div class="hero-workflow" aria-label="四阶段处理流程">
          <span class="hero-note coral"><b>01</b>素材整理</span>
          <span class="hero-note marigold"><b>02</b>识别校对</span>
          <span class="hero-note sky"><b>03</b>内容整理</span>
          <span class="hero-note midnight"><b>04</b>导出文稿</span>
        </div>
      </header>
      <section class="library-section">
        <div class="section-heading">
          <div><span class="eyebrow">YOUR LIBRARY</span><h2>最近任务</h2></div>
          <span id="library-storage" class="library-storage">历史任务会保留在本机</span>
        </div>
        <div id="library-task-list" class="library-task-list"></div>
      </section>
    </section>

    <section id="workspace-view" class="workspace-view hidden">
      <header class="workspace-head">
        <button id="task-drawer-open" class="square-btn" title="打开任务库"><i data-lucide="panel-left-open"></i></button>
        <div class="task-title-wrap">
          <input id="task-title" class="task-title" value="未创建任务" aria-label="任务名称" disabled>
          <span id="autosave-state" class="autosave-state"></span>
        </div>
        <div class="head-actions">
          <button id="workspace-home" class="btn text"><i data-lucide="layout-grid"></i>任务首页</button>
          <button id="add-images-btn" class="btn secondary"><i data-lucide="image-plus"></i>添加截图</button>
          <button id="delete-task-btn" class="btn danger text" disabled title="删除当前任务"><i data-lucide="trash-2"></i>删除</button>
        </div>
      </header>

      <nav class="steps" aria-label="处理阶段">
        <button data-stage="materials" class="step current"><span>1</span><b>素材整理</b><small>导入与分组</small></button>
        <em></em>
        <button data-stage="review" class="step locked"><span>2</span><b>识别与校对</b><small>提取并修正</small></button>
        <em></em>
        <button data-stage="organize" class="step locked"><span>3</span><b>内容整理</b><small>逐篇生成</small></button>
        <em></em>
        <button data-stage="export" class="step locked"><span>4</span><b>导出</b><small>预览与保存</small></button>
      </nav>

      <div class="work-area">
        <aside id="source-panel" class="source-panel"></aside>
        <section id="stage-content" class="stage-content"></section>
      </div>

      <footer class="command-bar">
        <div class="status-wrap"><span id="status-dot" class="status-dot"></span><span id="status-text">就绪</span></div>
        <div class="command-actions">
          <button id="back-action" class="btn text hidden"><i data-lucide="arrow-left"></i>上一步</button>
          <button id="secondary-action" class="btn secondary hidden"></button>
          <button id="primary-action" class="btn primary" disabled>添加截图</button>
          <button id="cancel-action" class="btn danger hidden"><i data-lucide="circle-stop"></i>取消处理</button>
        </div>
      </footer>
    </section>
  </main>

  <div id="task-drawer-overlay" class="drawer-overlay" aria-hidden="true">
    <aside class="task-drawer">
      <header>
        <div><span class="eyebrow">YOUR LIBRARY</span><h2>切换任务</h2></div>
        <button id="task-drawer-close" class="square-btn" aria-label="关闭任务抽屉"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-actions">
        <button id="drawer-import" class="btn primary"><i data-lucide="image-plus"></i>导入截图</button>
        <button id="drawer-new-task" class="btn secondary"><i data-lucide="plus"></i>空任务</button>
      </div>
      <div id="drawer-task-list" class="drawer-task-list"></div>
      <footer id="drawer-storage"></footer>
    </aside>
  </div>

  <div id="settings-overlay" class="overlay" aria-hidden="true">
    <section class="modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header><div><span class="eyebrow">CONNECTION</span><h2 id="settings-title">连接设置</h2></div><button id="settings-close" class="square-btn" aria-label="关闭设置"><i data-lucide="x"></i></button></header>
      <div class="modal-body">
        <div id="secure-warning" class="notice warning hidden"></div>
        <section class="setting-card">
          <div class="setting-card-head"><div><strong>OCR API</strong><p>需要支持图片输入的 OpenAI 兼容模型</p></div><button id="test-ocr" class="btn secondary small">测试连接</button></div>
          <label>API Key<div class="password-row"><input id="ocr-key" type="password" placeholder="留空则保留已保存的 Key"><button data-toggle-password="ocr-key" class="square-btn" type="button">显示</button></div></label>
          <label>API 地址<input id="ocr-host" placeholder="https://api.example.com"></label>
          <label>模型<input id="ocr-model" placeholder="视觉模型名称"></label>
        </section>
        <button id="copy-ocr-config" class="copy-config">↓ 复制 OCR 配置到整理 API</button>
        <section class="setting-card">
          <div class="setting-card-head"><div><strong>整理 API</strong><p>把校对后的文字整理为 Markdown</p></div><button id="test-llm" class="btn secondary small">测试连接</button></div>
          <label>API Key<div class="password-row"><input id="llm-key" type="password" placeholder="留空则保留已保存的 Key"><button data-toggle-password="llm-key" class="square-btn" type="button">显示</button></div></label>
          <label>API 地址<input id="llm-host" placeholder="https://api.example.com"></label>
          <label>模型<input id="llm-model" placeholder="文本模型名称"></label>
        </section>
        <input id="setting-theme" type="checkbox" checked hidden>
      </div>
      <footer><button id="settings-cancel" class="btn secondary">取消</button><button id="settings-save" class="btn primary">保存设置</button></footer>
    </section>
  </div>

  <div id="image-viewer" class="image-viewer" aria-hidden="true">
    <header class="image-viewer-bar">
      <div><strong id="image-viewer-title">完整截图</strong><span>上下滚动可查看长图全部内容</span></div>
      <button id="image-viewer-close" class="square-btn" aria-label="关闭完整截图"><i data-lucide="x"></i></button>
    </header>
    <div id="image-viewer-canvas" class="image-viewer-canvas"><img id="image-viewer-image" alt=""></div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="./renderer/dom.js"></script>
  <script src="./renderer/flow.js"></script>
  <script src="./renderer/app.js"></script>
</body>
</html>
